<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Steeple — rent affordable halls, studios and gyms by the hour from Northern Virginia venues. Five real listings, explored as one continuous scene."
    />
    <title>Steeple — Community space to rent in Northern Virginia</title>

    <!--
      The share card and the crawler's first read (docs/SEO.md items 4–6).

      This is the app's *one* set of tags: every route here is a hash route over
      the same document, so nothing below can be per-listing without the
      rendering layer D9 defers (docs/backlog/seo-crawlable-listings.md). What it
      does buy is that a link to Steeple unfurls as Steeple rather than as a bare
      URL, and that a crawler which runs no JavaScript still learns what this is.

      No og:image and no og:url on purpose: the image would be one listing's
      photograph standing for all of them, and the URL is not knowable in a
      bundle deployable at either / or a stripped prefix.

      The ld+json block below is not an inline script the CSP has to allow: a
      <script> whose type is not a JavaScript type is a *data block*, which the
      HTML spec never prepares for execution, so script-src never sees it. That
      is why this may be inline while src/core/intent.js may not.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Steeple" />
    <meta property="og:title" content="Steeple — community space to rent in Northern Virginia" />
    <meta
      property="og:description"
      content="Halls, studios and rooms in Northern Virginia venues, by the hour. Find one near you, see when it is open, and book it."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Steeple — community space to rent in Northern Virginia" />
    <meta
      name="twitter:description"
      content="Halls, studios and rooms in Northern Virginia venues, by the hour. Find one near you, see when it is open, and book it."
    />
    <meta name="theme-color" content="#fbf7f0" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Steeple",
        "description": "Halls, studios and rooms in Northern Virginia venues, rented by the hour."
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 21 14 25 14 25 17 23 17 23 30 19 30 19 24a3 3 0 0 0-6 0v6H9V17H7v-3h4Z' fill='%23C0623F'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/map.css" />
    <link rel="stylesheet" href="/src/styles/panels.css" />
    <link rel="stylesheet" href="/src/styles/guest.css" />
    <link rel="stylesheet" href="/src/styles/host.css" />
    <style>
      /* Paper, not white, on the frames before the stylesheet lands. */
      html {
        background: #fbf7f0;
      }
    </style>
  </head>
  <body>
    <!-- The village's own opening frame, photographed once per frame shape at
         the shape's widest aspect (tools/poster.mjs — a re-run prints this
         whole block; paste it). One poster per aspect because the camera
         composes by aspect; the live render opens composed against the chosen
         photograph's aspect and eases to the window's own once the crossfade
         has landed (journey/index.js), which is what makes the handoff
         seamless. It stands under the transparent canvas so the first paint is
         the real splash artwork; main.js retires it. -->
    <picture id="poster" aria-hidden="true">
      <source media="(min-aspect-ratio: 15/8)" srcset="assets/poster-village-2585x1100.d9900e65.webp" />
      <source media="(min-aspect-ratio: 33/20)" srcset="assets/poster-village-2400x1280.8594ec22.webp" />
      <source media="(min-aspect-ratio: 29/20)" srcset="assets/poster-village-2376x1440.c1313121.webp" />
      <source media="(min-aspect-ratio: 23/20)" srcset="assets/poster-village-2088x1440.aa7b1767.webp" />
      <source media="(min-aspect-ratio: 4/5)" srcset="assets/poster-village-1656x1440.6f007b91.webp" />
      <source media="(min-aspect-ratio: 5/8)" srcset="assets/poster-village-1280x1600.8297e5da.webp" />
      <img src="assets/poster-village-1000x1600.9fcd4feb.webp" fetchpriority="high" decoding="async" alt="" />
    </picture>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="ui">
      <!-- The title page, printed into the document so it is on screen before a
           byte of JavaScript has arrived. ui/arrival.js adopts this markup and
           wires the buttons rather than rebuilding it; its shape and words are
           the build path in that file and ui/copy.js ARRIVAL — change all three
           together.

           Every control here is a real link to the hash route it means, so a
           press lands somewhere even if no script ever arrives: the URL is the
           recovery truth. `data-intent` is what src/core/intent.js reads, and
           once the roll is live the native navigation is prevented and the
           cinematic runs instead (build_plan Phase 3.5). -->
      <div id="arrival" class="arrival is-open">
        <div class="arrival__sheet">
          <p class="eyebrow arrival__eyebrow">Community space in Northern Virginia</p>
          <div class="arrival__mark">
            <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false">
              <path
                d="M16 2 21 14 25 14 25 17 23 17 23 30 19 30 19 24a3 3 0 0 0-6 0v6H9V17H7v-3h4Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <h1 class="arrival__wordmark">Steeple</h1>
          <p class="arrival__line">
            Affordable halls, studios and gyms to rent by the hour from neighborhood venues —
            for playgroups, classes, rehearsals and clubs.
          </p>
          <div class="arrival__actions">
            <a class="pill pill--primary arrival__cta" href="#/browse" data-intent="village">Find a space</a>
            <a class="pill arrival__host" href="#/desk" data-intent="desk">Host a space</a>
          </div>
          <p class="arrival__hint">Or scroll to browse the spaces nearby.</p>
          <a
            class="arrival__scroll"
            href="#/browse"
            data-intent="village"
            aria-label="Scroll down to the spaces nearby"
          >
            <span class="arrival__thread" aria-hidden="true"></span>
            <span class="arrival__chevron" aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </div>
    <div id="a11y" class="visually-hidden" aria-live="polite"></div>
    <!-- One module entry. The arrival intent controller (src/core/intent.js) is
         the entry's first static import and imports nothing itself, so it is
         armed before main.js's own body runs and long before the interface
         chunk — which is what lets the printed page above answer a press. A
         second <script> here would not buy it a frame: Vite folds every extra
         html entry back into this one as a static import. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
