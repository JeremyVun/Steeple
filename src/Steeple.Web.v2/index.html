<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The application's base, and it is first on purpose: <base> only governs
      the URL-bearing nodes that come after it, so nothing with an href or a src
      may be written above this line.

      `./` is what makes one build deployable at either / or a stripped prefix
      (docs/backlog/seo/design.md SEO-D4, §7): the document resolves it against
      its own address, so this file loaded at /index.html bases on / and the
      same file loaded at /steeple/index.html bases on /steeple/. That is what
      holds `assets/…`, the poster, and data/api.js's document-relative
      `api/v1` on the deployment they were served from.

      It is also the invariant the clean routes rest on. Once the router starts
      writing paths, /space/v/r would re-resolve a *relative* base to /space/,
      and every relative asset and API call with it — so `freezeBase()` in
      src/core/router.js resolves this value to its absolute pathname and writes
      it back to this element before the first history write, which is also
      before core/intent.js can answer a press. Until then the relative form is
      the correct one, because only the browser knows which prefix the document
      arrived under.

      The two query-string defects this base briefly carried are closed (P3,
      2026-08-08): the printed controls below are clean paths rather than
      fragments, and every history write core/router.js makes carries
      `location.search` through verbatim. `tools/boot-priority-test.mjs` is the
      watch on both, and is green at `/` and at `?q=low`.
    -->
    <base href="./" />
    <!--
      WHAT `data-steeple-route-meta` MARKS, HERE AND EVERYWHERE (SEO-D7).

      It is the mark of a head node the *route* owns, and src/ui/metadata.js
      removes the whole marked set before writing the next one. steeple's own
      listing documents mark theirs (`Services/Seo/WebDocumentRenderer.cs`), so
      a route change replaces them cleanly; the nodes printed below are the site
      defaults for the same set and carry the same mark for the same reason.

      Without it this file's head is a second, unremovable opinion. This
      document is served at `/` and at every legacy `#/…` fragment over it, so
      the app would leave an unmarked canonical naming `/` on a `noindex` browse
      surface — the mixed signal SEO-D7 forbids — and two canonicals, two
      descriptions and two `ld+json` blocks on a legacy `#/room/…` link.

      Marked: canonical, description, the og: and twitter: sets, and the WebSite
      data block. Not marked: the title element (metadata.js assigns
      document.title, so there is nothing to remove), and the things that are the
      document's rather than the route's — charset, base, viewport, theme-color,
      icon, styles.

      The words below and `src/ui/metaText.js` SITE_META are the same words, so
      the swept-in set says what the printed set said; tools/metadata-test.mjs
      §5 reads this file and asserts both halves of that.

      The route documents in public/route-documents/ carry no marks and want
      none: the handoff copies only styles out of a shell head, so a boot
      document's own head is never joined by this one, and the `noindex` it
      prints is the served truth a crawler with no JavaScript reads.
    -->
    <!--
      The root document's own address, and the only self-canonical in this file
      (SEO-D7): deployment-relative, so it names / at the root and /steeple/
      behind a stripped prefix, from one build. `vite-ignore` is what keeps the
      bundler's hands off it — every other link[href] in an html entry is an
      asset to be hashed and copied, and `./` is a directory. The attribute is
      removed from the built output.
    -->
    <link rel="canonical" href="./" vite-ignore data-steeple-route-meta />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      data-steeple-route-meta
      content="Steeple — rent affordable halls, studios and gyms by the hour from venues across the Washington, DC area."
    />
    <title>Steeple — Community space to rent near Washington, DC</title>

    <!--
      The share card and the crawler's first read (docs/contracts/seo.md).

      This is the app's *one* set of tags: every route here is a hash route over
      the same document, so nothing below can be per-listing without the
      rendering layer D9 defers (docs/backlog/seo-crawlable-listings.md). What it
      does buy is that a link to Steeple unfurls as Steeple rather than as a bare
      URL, and that a crawler which runs no JavaScript still learns what this is.

      No og:image and no og:url on purpose: the image would be one listing's
      photograph standing for all of them, and the URL is not knowable in a
      bundle deployable at either / or a stripped prefix.

      The ld+json block below is not an inline script the CSP has to allow: a
      <script> whose type is not a JavaScript type is a *data block*, which the
      HTML spec never prepares for execution, so script-src never sees it. That
      is why this may be inline while src/core/intent.js may not.
    -->
    <meta property="og:type" content="website" data-steeple-route-meta />
    <meta property="og:site_name" content="Steeple" data-steeple-route-meta />
    <meta
      property="og:title"
      data-steeple-route-meta
      content="Steeple — community space to rent near Washington, DC"
    />
    <meta
      property="og:description"
      data-steeple-route-meta
      content="Halls, studios and rooms across the Washington, DC area, by the hour. Find one near you, see when it is open, and book it."
    />
    <meta name="twitter:card" content="summary" data-steeple-route-meta />
    <meta
      name="twitter:title"
      data-steeple-route-meta
      content="Steeple — community space to rent near Washington, DC"
    />
    <meta
      name="twitter:description"
      data-steeple-route-meta
      content="Halls, studios and rooms across the Washington, DC area, by the hour. Find one near you, see when it is open, and book it."
    />
    <meta name="theme-color" content="#fbf7f0" />
    <script type="application/ld+json" data-steeple-route-meta>
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Steeple",
        "description": "Halls, studios and rooms across the Washington, DC area, rented by the hour."
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 21 14 25 14 25 17 23 17 23 30 19 30 19 24a3 3 0 0 0-6 0v6H9V17H7v-3h4Z' fill='%23C0623F'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/map.css" />
    <link rel="stylesheet" href="/src/styles/panels.css" />
    <link rel="stylesheet" href="/src/styles/guest.css" />
    <link rel="stylesheet" href="/src/styles/host.css" />
    <style>
      /* Paper, not white, on the frames before the stylesheet lands. */
      html {
        background: #fbf7f0;
      }
    </style>
  </head>
  <body>
    <!-- The village's own opening frame, photographed once per frame shape at
         the shape's widest aspect (tools/poster.mjs — a re-run prints this
         whole block; paste it). One poster per aspect because the camera
         composes by aspect; the live render opens composed against the chosen
         photograph's aspect and eases to the window's own once the crossfade
         has landed (journey/index.js), which is what makes the handoff
         seamless. It stands under the transparent canvas so the first paint is
         the real splash artwork; main.js retires it. -->
    <picture id="poster" aria-hidden="true">
      <source media="(min-aspect-ratio: 15/8)" srcset="assets/poster-village-2585x1100.d9900e65.webp" />
      <source media="(min-aspect-ratio: 33/20)" srcset="assets/poster-village-2400x1280.8594ec22.webp" />
      <source media="(min-aspect-ratio: 29/20)" srcset="assets/poster-village-2376x1440.c1313121.webp" />
      <source media="(min-aspect-ratio: 23/20)" srcset="assets/poster-village-2088x1440.aa7b1767.webp" />
      <source media="(min-aspect-ratio: 4/5)" srcset="assets/poster-village-1656x1440.6f007b91.webp" />
      <source media="(min-aspect-ratio: 5/8)" srcset="assets/poster-village-1280x1600.8297e5da.webp" />
      <img src="assets/poster-village-1000x1600.9fcd4feb.webp" fetchpriority="high" decoding="async" alt="" />
    </picture>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="ui">
      <!-- The title page, printed into the document so it is on screen before a
           byte of JavaScript has arrived. ui/arrival.js adopts this markup and
           wires the buttons rather than rebuilding it; its shape and words are
           the build path in that file and ui/copy.js ARRIVAL — change all three
           together.

           Every control here is a real link to the clean route it means —
           relative to the <base> above, so one build says /browse at the root
           and /steeple/browse behind a stripped prefix — and a press lands on a
           real document even if no script ever arrives: the URL is the recovery
           truth. `data-intent` is what src/core/intent.js reads; from the frame
           it is armed a press is answered without leaving the document (the
           same path, written by hand, query intact), and once the roll is live
           it is the cinematic instead (build_plan Phase 3.5 · SEO-D1). -->
      <div id="arrival" class="arrival is-open">
        <div class="arrival__sheet">
          <p class="eyebrow arrival__eyebrow">Community space in the Washington, DC area</p>
          <div class="arrival__mark">
            <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true" focusable="false">
              <path
                d="M16 2 21 14 25 14 25 17 23 17 23 30 19 30 19 24a3 3 0 0 0-6 0v6H9V17H7v-3h4Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <h1 class="arrival__wordmark">Steeple</h1>
          <p class="arrival__line">
            Affordable halls, studios and gyms to rent by the hour from neighborhood venues —
            for playgroups, classes, rehearsals and clubs.
          </p>
          <div class="arrival__actions">
            <a class="pill pill--primary arrival__cta" href="browse" data-intent="village">Find a space</a>
            <a class="pill arrival__host" href="desk" data-intent="desk">Host a space</a>
          </div>
          <p class="arrival__hint">Or scroll to browse the spaces nearby.</p>
          <a
            class="arrival__scroll"
            href="browse"
            data-intent="village"
            aria-label="Scroll down to the spaces nearby"
          >
            <span class="arrival__thread" aria-hidden="true"></span>
            <span class="arrival__chevron" aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </div>
    <div id="a11y" class="visually-hidden" aria-live="polite"></div>
    <!-- One module entry. The arrival intent controller (src/core/intent.js) is
         the entry's first static import and imports nothing itself, so it is
         armed before main.js's own body runs and long before the interface
         chunk — which is what lets the printed page above answer a press. A
         second <script> here would not buy it a frame: Vite folds every extra
         html entry back into this one as a static import. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
