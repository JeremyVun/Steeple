# The SPA's host: static files, the same-origin /api seam, and the headers a
# static host is the only thing in the stack that can set.
#
# Two nginx rules shape the file:
#   · `add_header` does not merge — a location with any add_header of its own
#     inherits none from the server block. So every app location repeats the
#     whole set, and the policy itself is written once into $csp.
#   · gzip never lists text/html: nginx compresses it whenever gzip is on, and
#     naming it there is an error.

# The edge (caddy) terminates TLS and forwards plain http, so $scheme here is always "http".
# Pass the edge's own X-Forwarded-Proto through when it sent one — the API reads it to decide
# whether the refresh cookie may carry Secure (docs/contracts/identity.md).
map $http_x_forwarded_proto $steeple_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    # Below about half a kilobyte the header costs more than the saving.
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # The content policy, from an inventory of what this page actually loads —
    # not a template. Everything is same-origin by design; these are the four
    # exceptions and the reason each one exists.
    #
    #   img  https://*.tile.openstreetmap.org  the discovery map's tiles (ui/map/atlas.js)
    #   img  https://images.unsplash.com       room photography, absolute in the DB
    #                                          (db/changelog/012-room-photo-curation.sql)
    #   img  data:                             the favicon and the CSS rules that draw in SVG
    #   img  blob:                             a host's own photo, previewed before it is sent
    #                                          (ui/host/listing.js: URL.createObjectURL)
    #
    # ⚠ Uploaded room photos are served from `Media:PublicBaseUrl` and stored as
    # ABSOLUTE urls. While that is this origin they are covered by 'self'; the
    # day it becomes a CDN or a Spaces bucket, that origin must be added to
    # img-src here or every uploaded photo silently stops loading.
    #
    # style-src carries 'unsafe-inline' because Leaflet and the panels style
    # elements from script; script-src does not, and there is no inline <script>
    # in the bundle for it to need. No paths appear anywhere in the policy, so
    # it holds unchanged behind a stripped sub-path prefix.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com; font-src 'self'; connect-src 'self'";

    # The wire. No headers added here: the API answers for its own responses,
    # and a content policy on a JSON body protects nobody.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
