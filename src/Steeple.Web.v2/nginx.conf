# The SPA's host: static files, the same-origin /api seam, and the headers a
# static host is the only thing in the stack that can set.
#
# Two nginx rules shape the file:
#   · `add_header` does not merge — a location with any add_header of its own
#     inherits none from the server block. So every app location repeats the
#     whole set, and the policy itself is written once into $csp.
#   · gzip never lists text/html: nginx compresses it whenever gzip is on, and
#     naming it there is an error.

# The edge (caddy) terminates TLS and forwards plain http, so $scheme here is always "http".
# Pass the edge's own X-Forwarded-Proto through when it sent one — the API reads it to decide
# whether the refresh cookie may carry Secure (docs/contracts/identity.md).
# Caddy is the only deployed proxy. Trust forwarded client data only from private Docker peers;
# direct public requests retain their socket address. The API then receives one canonical value,
# never an attacker-controlled comma chain.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $steeple_trusted_edge {
    default         0;
    172.16.0.0/12   1;
}

map "$steeple_trusted_edge:$http_x_forwarded_proto" $steeple_forwarded_proto {
    "1:https"  https;
    "1:http"   http;
    default    $scheme;
}

# The sub-path a deployment is reached under, when it has one, is nothing this
# file has an opinion about any more. Caddy strips /steeple before this server
# sees the request and names it in X-Forwarded-Prefix; there used to be a
# trusted-peer map here setting that header on the way out, and nothing
# downstream ever read it — the API takes the canonical origin *and* prefix from
# its own Seo:PublicBaseUrl and from nowhere else (docs/backlog/seo/design.md
# §7, docs/contracts/seo.md). Setting a header no reader consults only made that
# configuration look optional when a prefixed deployment requires it.
#
# Nothing is set and nothing is stripped: a request that arrives carrying the
# header reaches the API with it, as any header nginx is not told about does.
# That is deliberate — it is the only way the API can notice a prefixed
# deployment whose Seo:PublicBaseUrl was never set and say so in its log, once,
# naming the key. The value still decides no URL, so the worst a stranger's
# invented prefix can cost is that single log line.

limit_req_zone $binary_remote_addr zone=steeple_api_total:10m rate=5r/s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    # Below about half a kilobyte the header costs more than the saving.
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # The content policy, from an inventory of what this page actually loads —
    # not a template. Everything is same-origin by design; these are the
    # exceptions and the reason each one exists.
    #
    #   img  https://*.tile.openstreetmap.org  the discovery map's tiles (ui/map/atlas.js)
    #   img  https://images.unsplash.com       room photography, absolute in the DB
    #                                          (db/changelog/012-room-photo-curation.sql)
    #   img  data:                             the favicon and the CSS rules that draw in SVG
    #   img  blob:                             a host's own photo, previewed before it is sent
    #                                          (ui/host/listing.js: URL.createObjectURL)
    #
    # The sign-in providers and the bot check (v2_migration P4). Each of the three
    # is loaded only when its key is configured (data/providers.js, data/turnstile.js),
    # so on a build with none of them nothing here is ever reached — but the policy
    # is one string for every deploy, and a policy that has to be edited at go-live
    # is a policy that will be edited wrong at go-live.
    #
    #   script  accounts.google.com                Google Identity Services
    #   script  appleid.cdn-apple.com              Sign in with Apple JS
    #   script  challenges.cloudflare.com          Turnstile
    #   frame   accounts.google.com                the GIS button and its popup
    #   frame   appleid.apple.com                  Apple's web_message popup
    #   frame   challenges.cloudflare.com          the Turnstile widget's iframe
    #   connect accounts.google.com                GIS talking to its own backend
    #   style   accounts.google.com                the GIS button's own stylesheet (gsi/style)
    #   img     https://*.googleusercontent.com    the signed-in Google account's avatar
    #
    # `form-action` gains appleid.apple.com because Apple's popup posts back to it,
    # and `frame-ancestors 'none'` stays: Steeple frames other people, never the
    # reverse. connect-src does NOT gain Turnstile — its widget talks from inside
    # its own iframe, which carries Cloudflare's policy and not ours.
    #
    # Local-disk room photos use same-origin media/... paths. Object-storage
    # photos are absolute CDN URLs; add the permanent CDN origin to img-src
    # before enabling that adapter or every uploaded photo stops loading.
    #
    # style-src carries 'unsafe-inline' because Leaflet and the panels style
    # elements from script; script-src does not, and there is no inline <script>
    # in the bundle for it to need — index.html's ld+json is a data block, which
    # is never prepared for execution and so never checked against script-src.
    # No paths appear anywhere in the policy, so it holds unchanged behind a
    # stripped sub-path prefix.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://appleid.apple.com; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com https://*.googleusercontent.com https://steeple.sfo3.cdn.digitaloceanspaces.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com https://appleid.apple.com https://challenges.cloudflare.com";

    # ── route precedence ────────────────────────────────────────────────────
    #
    # Five steps, in this order, and the order is the contract
    # (docs/backlog/seo/design.md SEO-D3 · build_plan P2.3):
    #
    #   1. /api/, /media/, /robots.txt, /sitemap.xml and /assets/ keep their
    #      existing owners
    #   2. the root document and the public files beside it stay static
    #   3. /space/{venue}/{room} is proxied to the API, which renders it
    #   4. the other known clean routes serve a depth-correct boot document
    #   5. everything else is 404.html at status 404
    #
    # Step 5 is the one that changed a shipped behaviour: this file used to end
    # `try_files $uri $uri/ /index.html`, so every unknown path — and every URL
    # in the sitemap, which the app could not parse — answered 200 with the
    # village shell. A soft 404 at the first hop of the share loop.
    #
    # `^~` on the prefix locations below is deliberate: nginx consults regex
    # locations before an ordinary prefix match, so without it the clean-route
    # patterns in step 4 could one day be asked about /api/, /assets/ or
    # /media/. `^~` settles that in this file rather than in whoever edits it
    # next. The listing route in step 3 is itself a regex, because "two
    # segments" is the shape the API answers and anything else under /space/
    # belongs to the 404.

    # The wire. No headers added here: the API answers for its own responses,
    # and a content policy on a JSON body protects nobody.
    location ^~ /api/ {
        limit_req zone=steeple_api_total burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
    }

    # Local-disk room photos use document-relative media/... URLs. Serve them through the same
    # first-party origin as the SPA so the URL survives port/host changes and `img-src 'self'`
    # remains sufficient. Production CDN URLs are absolute and bypass this location.
    location ^~ /media/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
        # Content-hashed objects are immutable, but never pin an upstream 404 for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The crawl policy, and the one line in it that has to be absolute: the
    # sitemaps.org protocol ignores a relative `Sitemap:` URL, and autodiscovery
    # is how this deployment's sitemap gets found at all. Only the API knows the
    # public origin, so the API writes the file (GET /robots.txt on its own
    # root, path passed through untouched) and this is the alias — the same
    # arrangement as /sitemap.xml below.
    #
    # No error_page here on purpose. With the API down this answers 502, which
    # is what a crawler should be told: it retries and asks again. A static
    # fallback would be worse than an outage — it would be the old file, with
    # the relative Sitemap: line that started this, served as if it were true.
    location = /robots.txt {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host, not $host — see the sitemap below: the Sitemap: URL this
        # renders names the origin the request arrived on wherever
        # Seo:PublicBaseUrl is unset, and the port is part of that origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
    }

    # Where robots.txt says the sitemap is. The bundle has no server of its own
    # to render one, so the API does (GET /api/v1/sitemap.xml) and this is the
    # alias — an exact-match location, so nothing else about /sitemap is caught.
    # No headers: it is XML for a crawler, and a content policy on it protects
    # nobody. `= ` beats the prefix locations, so this never reaches try_files.
    location = /sitemap.xml {
        proxy_pass http://api:8080/api/v1/sitemap.xml;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, and a document whose
        # canonical named http://localhost when the visitor asked
        # http://localhost:8080 is a document advertising an address that does
        # not answer. In a configured deployment Seo:PublicBaseUrl decides this
        # outright; where it is unset the API falls back to the request's own
        # origin, and the request should carry the origin that was asked for.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── 3. the listing document ─────────────────────────────────────────────
    #
    # The one data-dependent web route, and the one exception to "the API is
    # JSON" (SEO-D3): only the API knows whether this room is published, in
    # area and not taken down, so only the API can answer with the right body
    # AND the right status. The path is passed through untouched — the canonical
    # URL a crawler indexes is the URL the API is asked about.
    #
    # The shape is matched here rather than proxying all of /space/: a request
    # that is not two segments is not a listing, and it belongs to the static
    # 404 below, not to the API's router. The optional trailing slash is
    # included on purpose — the API answers it with the 301 to the canonical
    # form (SEO-D9), which it cannot do if nginx 404s it first.
    location ~ ^/space/[^/]+/[^/]+/?$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # $http_host for the same reason as the sitemap above: the canonical,
        # og:url and <base> in this response are built from the origin the
        # request arrived on whenever Seo:PublicBaseUrl is unset.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # An outage is not a "not found". Only the transport failures are taken
        # over here, and the boot document that replaces the body keeps the
        # upstream's own 502/503/504 — a person still reaches the app and its
        # bundled fallback, and a crawler is told "temporarily unavailable"
        # rather than being handed a false 200 or, worse, a 404 that would
        # de-index a live listing (SEO-D3, design §10). The API's own 404 and
        # its 301 are not error pages here: they are answers, and they pass
        # through exactly as rendered.
        proxy_intercept_errors on;
        error_page 502 503 504 /route-documents/app-depth-3.html;

        # Cache-Control and X-Robots-Tag are the API's to set per status; the
        # policy headers a static host is the only thing that can set are ours.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── 4. the other clean routes ───────────────────────────────────────────
    #
    # Boot documents, chosen by the depth of the route so the file's relative
    # <base> lands on the deployment root (public/route-documents/*.html).
    # `try_files` with a literal path serves the file inside this location, so
    # each route keeps its own headers — which is the whole reason the routes
    # are listed separately rather than sharing one internal location.
    #
    # None of them is indexable and none carries any data: the app fetches
    # everything behind these addresses itself, under authorization, after the
    # handoff (SEO-D11). `follow` for the public pair so a crawler still walks
    # to the listings they lead to; `nofollow` where the links are somebody's
    # own correspondence.

    location = /browse {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-1.html =404;
    }

    location ~ ^/venue/[^/]+$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-2.html =404;
    }

    # `no-store` from here down: these documents hold nothing private, but no
    # address behind a sign-in should be sitting in a shared cache (design §8).

    location ~ ^/apply/[^/]+/[^/]+$ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-3.html =404;
    }

    location = /journal {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-1.html =404;
    }

    location = /desk {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-1.html =404;
    }

    location ~ ^/desk/[^/]+$ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-2.html =404;
    }

    location ~ ^/letter/[^/]+$ {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /route-documents/app-depth-2.html =404;
    }

    # The boot documents' own address is not a route. They are reached by the
    # `try_files` above and by the listing proxy's error_page, both internal;
    # asked for directly, they are nothing. `internal` is also what lets the
    # 502/503/504 internal redirect land here at all, and this location is
    # where that response gets its headers — including the status-preserving
    # part of the deal, which is error_page's, not ours.
    location ^~ /route-documents/ {
        internal;
        # `always` on every line here: this location answers the listing
        # proxy's 502/503/504 as well as its own 200s, and add_header without
        # it is silently dropped on anything outside a short list of success
        # and redirect codes.
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ── 2 + 5. the root document, the files beside it, and nothing else ──────
    #
    # index.html for `/` and for `/#/…`, which the server never sees the
    # fragment of; the real files in public/ (the legal pages,
    # route-handoff.js, route-document.css) served as themselves at no-cache,
    # because their names are stable and their contents are not; and for any
    # other address, the designed 404 at status 404.
    # The root document, named rather than left to the index directive: with the
    # catch-all fallback gone, `/` is the one address that must still be
    # index.html and it should say so out loud.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /404.html {
        internal;
        # `always`: this location only ever answers 404 (see above).
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
