# The edge (caddy) terminates TLS and forwards plain http, so $scheme here is always "http".
# Pass the edge's own X-Forwarded-Proto through when it sent one — the API reads it to decide
# whether the refresh cookie may carry Secure (docs/contracts/identity.md).
map $http_x_forwarded_proto $steeple_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $steeple_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
