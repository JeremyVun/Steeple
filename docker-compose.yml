# Steeple stack: Postgres + the containerised apps on a private compose network.
# Only `web` and `admin` publish host ports; `api` and `flags` are internal-only (reachable by
# other services over the `steeple` network). Admin sits behind caddy/authelia at the edge.
# The server apps run in Production here; the inner dev loop is `dotnet run` / Vite.
# Postgres is bound to localhost purely for that dev loop.
services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: steeple-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steeple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-steeple}
      # Pin the data dir so the named volume maps to PGDATA directly. The postgres:18 image
      # otherwise stores data in a versioned subdir, which would silently re-init on a major bump.
      PGDATA: /var/lib/postgresql/data
    # Bound to 127.0.0.1 only: exposed for the local `dotnet run` dev loop, not the host network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - steeple_pgdata:/var/lib/postgresql/data
    networks:
      - steeple
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steeple} -d ${POSTGRES_DB:-steeple}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema + seed. Runs Liquibase against Postgres, applies the changelog, then exits 0.
  # This is the ONLY component that migrates — the apps never do.
  migrate:
    image: liquibase/liquibase:4.31
    container_name: steeple-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/changelog:/liquibase/changelog:ro
    networks:
      - steeple
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-steeple}
      - --username=${POSTGRES_USER:-steeple}
      - --password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - update
    restart: "no"

  # Backend API for web and mobile. Reads the shared Postgres; never migrates.
  # The SPA host proxies same-origin /api requests to it at http://api:8080.
  api:
    # image: steeple-api:${STEEPLE_API_VERSION:-latest}
    container_name: steeple-api
    build:
      context: .
      dockerfile: src/Steeple.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SteepleDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-steeple};Username=${POSTGRES_USER:-steeple};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      # Required deployment secret. Compose refuses to create the service when it is absent.
      Auth__Jwt__SigningKey: "${AUTH_JWT_SIGNING_KEY:?AUTH_JWT_SIGNING_KEY must be set}"
      Auth__Google__Mode: "${GOOGLE_SSO_MODE:-disabled}"
      Auth__Google__ClientIds__0: "${GOOGLE_CLIENT_ID:-}"
      Auth__Apple__Mode: "enabled"
      Auth__Apple__ClientIds__0: "${APPLE_SERVICES_ID:?APPLE_SERVICES_ID must be set}"
      Turnstile__Mode: "${TURNSTILE_MODE:?TURNSTILE_MODE must be enabled or disabled}"
      Turnstile__SecretKey: "${TURNSTILE_SECRET_KEY:-}"
      # Explicit real geocoder selection; Production never falls back to the dev stub.
      Geocoding__Mode: "${GEOCODING_MODE:?GEOCODING_MODE must be apple or google}"
      # Apple Maps Server credentials (geocoding + address typeahead).
      # APPLE_MAPS_PRIVATE_KEY is the .p8 body as one base64 line (strip the PEM armor).
      Geocoding__AppleTeamId: "${APPLE_MAPS_TEAM_ID:-}"
      Geocoding__AppleKeyId: "${APPLE_MAPS_KEY_ID:-}"
      Geocoding__ApplePrivateKey: "${APPLE_MAPS_PRIVATE_KEY:-}"
      Geocoding__GoogleApiKey: "${GEOCODING_GOOGLE_API_KEY:-}"
      # ISO country codes suggestions/geocoding are limited to; empty = worldwide.
      Geocoding__LimitToCountries: "${GEOCODING_LIMIT_COUNTRIES:-US}"
      # Media (ROADMAP Phase 5): local-disk uploads return origin-independent media/... paths;
      # the web/Admin proxy them to this API. Object storage uses this as its public CDN base.
      Media__Mode: "objectStorage"
      Media__PublicBaseUrl: "${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL must be set}"
      Media__ServiceUrl: "${MEDIA_SERVICE_URL:?MEDIA_SERVICE_URL must be set}"
      Media__Bucket: "${MEDIA_BUCKET:?MEDIA_BUCKET must be set}"
      Media__AccessKey: "${MEDIA_ACCESS_KEY:?MEDIA_ACCESS_KEY must be set}"
      Media__SecretKey: "${MEDIA_SECRET_KEY:?MEDIA_SECRET_KEY must be set}"
      # The canonical public origin every crawler-facing absolute URL is built from — sitemap
      # <loc>, listing canonicals, og:url and the document <base> (docs/backlog/seo/design.md §7,
      # which requires a deployment behind a stripped prefix to set it). Empty falls back to the
      # request's own origin and earns a startup warning outside Development.
      Seo__PublicBaseUrl: "${SEO_PUBLIC_BASE_URL:?SEO_PUBLIC_BASE_URL must be set}"
      Email__Mode: "resend"
      Email__ApiKey: "${EMAIL_API_KEY:?EMAIL_API_KEY must be set}"
      Email__From: "${EMAIL_FROM:?EMAIL_FROM must be set}"
      Email__WebBaseUrl: "${EMAIL_WEB_BASE_URL:?EMAIL_WEB_BASE_URL must be set}"
      Push__Mode: "${PUSH_MODE:-disabled}"
      Push__ServiceAccountJson: "${PUSH_SERVICE_ACCOUNT_JSON:-}"
      Push__ServiceAccountJsonPath: "${PUSH_SERVICE_ACCOUNT_JSON_PATH:-}"
      Flags__mobile.manage_enabled: "${MOBILE_MANAGE_ENABLED:-false}"
      # Must be on whenever web.availability_picker is on (below) — the picker's calendar,
      # free windows, and live check all read this API surface (off → 404 → all-closed grid).
      Flags__listing.availability: "${LISTING_AVAILABILITY:-true}"
    # Loopback-only for mobile/direct API development; browser media goes through web/Admin.
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    volumes:
      - steeple_api_media:/app/media-store
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - steeple
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    # image: steeple-web:${STEEPLE_WEB_VERSION:-latest}
    container_name: steeple-web
    build:
      context: .
      dockerfile: src/Steeple.Web.v2/Dockerfile
      # Baked into the bundle at build time — the same .env names the api service
      # reads, so one entry keys both sides (sso-and-turnstile.md: "both or neither").
      args:
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
        VITE_APPLE_CLIENT_ID: "${APPLE_SERVICES_ID:?APPLE_SERVICES_ID must be set}"
        VITE_APPLE_REDIRECT_URI: "${APPLE_REDIRECT_URI:?APPLE_REDIRECT_URI must be set}"
        VITE_TURNSTILE_MODE: "${TURNSTILE_MODE:?TURNSTILE_MODE must be enabled or disabled}"
      secrets:
        - source: turnstile_site_key
          target: TURNSTILE_SITE_KEY
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - steeple
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    # image: steeple-admin:${STEEPLE_ADMIN_VERSION:-latest}
    container_name: steeple-admin
    build:
      context: .
      dockerfile: src/Steeple.Admin/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SteepleDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-steeple};Username=${POSTGRES_USER:-steeple};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "${ADMIN_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - steeple
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  steeple:
    driver: bridge

volumes:
  steeple_pgdata:
  steeple_api_media:

secrets:
  turnstile_site_key:
    environment: TURNSTILE_SITE_KEY
